# Increase JVM heap size to prevent builds from hanging and timing out
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Increase connection and read timeouts (values in milliseconds)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# This newDsl flag was added by the Flutter template
android.newDsl=false
android.builtInKotlin=false
kotlin.incremental=false
kotlin.incremental.java=false


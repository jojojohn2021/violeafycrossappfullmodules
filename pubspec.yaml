name: leafy_webapp
description: "Leafy - Authentic Online Store"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^17.4.0

  # Media & Hardware Features
  speech_to_text: ^7.4.0
  image_picker: ^1.1.2

  # Network & API
  http: ^1.2.2

  # Firebase Suite
  firebase_core: ^4.13.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.4.6

  # Local Cache & Utilities
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6
  intl: ^0.20.3
  payu_checkoutpro_flutter: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Logo.png

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LeafyMart">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=6.0.0">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=6.0.0"/>
  <link rel="icon" type="image/png" href="favicon.png?v=6.0.0"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=6.0.0"/>

  <title>LeafyMart - Connect,Refer,Earn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js" defer></script>
  <script>
    window.addEventListener('OPEN_CASHFREE_CHECKOUT', function(e) {
      var detail = e.detail || {};
      var callbackName = detail.callbackName;
      try {
        if (!window.Cashfree) {
          console.error('Cashfree JS SDK not loaded');
          window.dispatchEvent(new CustomEvent(callbackName, {
            detail: JSON.stringify({ outcome: 'failed', message: 'Cashfree SDK not loaded' })
          }));
          return;
        }
        var cashfree = window.Cashfree({ mode: detail.mode || 'sandbox' });
        cashfree.checkout({
          paymentSessionId: detail.paymentSessionId,
          redirectTarget: '_modal'
        }).then(function(result) {
          if (result && result.error) {
            var isDismissed = (result.error.message || '').toLowerCase().indexOf('cancel') !== -1 ||
                              (result.error.message || '').toLowerCase().indexOf('closed') !== -1;
            window.dispatchEvent(new CustomEvent(callbackName, {
              detail: JSON.stringify({
                outcome: isDismissed ? 'cancelled' : 'failed',
                message: result.error.message || 'Payment not completed'
              })
            }));
          } else {
            // Always return pending/verify so backend S2S confirms final status authoritatively
            window.dispatchEvent(new CustomEvent(callbackName, {
              detail: JSON.stringify({ outcome: 'success' })
            }));
          }
        }).catch(function(err) {
          window.dispatchEvent(new CustomEvent(callbackName, {
            detail: JSON.stringify({ outcome: 'failed', message: (err && err.message) || 'Cashfree checkout error' })
          }));
        });
      } catch (err) {
        window.dispatchEvent(new CustomEvent(callbackName, {
          detail: JSON.stringify({ outcome: 'failed', message: String(err) })
        }));
      }
    });
  </script>
  <script>
    window.addEventListener('OPEN_RAZORPAY_CHECKOUT', function(e) {
      var detail = e.detail || {};
      var options = JSON.parse(detail.options || '{}');
      var callbackName = detail.callbackName;

      delete options.callback_url;
      delete options.redirect;

      options.handler = function(response) {
        window.dispatchEvent(new CustomEvent(callbackName, {
          detail: JSON.stringify({
            outcome: 'success',
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_order_id: response.razorpay_order_id,
            razorpay_signature: response.razorpay_signature
          })
        }));
      };
      options.modal = {
        ondismiss: function() {
          window.dispatchEvent(new CustomEvent(callbackName, {
            detail: JSON.stringify({ outcome: 'cancelled' })
          }));
        }
      };

      try {
        if (!window.Razorpay) {
          console.error('Razorpay SDK script not loaded');
          window.dispatchEvent(new CustomEvent(callbackName, {
            detail: JSON.stringify({ outcome: 'failed' })
          }));
          return;
        }
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function(response) {
          window.dispatchEvent(new CustomEvent(callbackName, {
            detail: JSON.stringify({ outcome: 'failed' })
          }));
        });
        rzp.open();
      } catch(err) {
        console.error('Razorpay Web JS Error:', err);
        window.dispatchEvent(new CustomEvent(callbackName, {
          detail: JSON.stringify({ outcome: 'failed' })
        }));
      }
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VioleafyCross">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2.0.0">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2.0.0"/>
  <link rel="icon" type="image/png" href="favicon.png?v=2.0.0"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2.0.0"/>

  <title>VioleafyCross</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    function showDemoPaymentModal(options, callbackName) {
      var backdrop = document.createElement('div');
      backdrop.id = 'demo-payment-modal';
      backdrop.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);z-index:999999;display:flex;align-items:center;justify-content:center;font-family:sans-serif;';
      
      var box = document.createElement('div');
      box.style.cssText = 'background:#fff;border-radius:12px;padding:24px;max-width:420px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,0.3);text-align:center;';
      
      var amountFormatted = (options.amount / 100).toFixed(2);
      box.innerHTML = `
        <div style="font-size:36px;margin-bottom:12px;">💳</div>
        <h3 style="margin:0 0 8px 0;color:#2D6A4F;font-size:20px;">Razorpay Test Sandbox</h3>
        <p style="margin:0 0 16px 0;color:#666;font-size:14px;">Simulating payment for Order: <b>${options.order_id || options.description}</b></p>
        <div style="background:#f4f6f8;padding:12px;border-radius:8px;margin-bottom:20px;font-size:18px;font-weight:bold;color:#111;">
          Amount: ₹${amountFormatted} ${options.currency || 'INR'}
        </div>
        <div style="display:flex;gap:10px;justify-content:center;">
          <button id="demo-pay-success" style="flex:1;background:#2D6A4F;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px;box-shadow:0 2px 6px rgba(45,106,79,0.3);">Simulate Success</button>
          <button id="demo-pay-cancel" style="flex:1;background:#e0e0e0;color:#333;border:none;padding:12px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px;">Cancel</button>
        </div>
      `;
      backdrop.appendChild(box);
      document.body.appendChild(backdrop);

      document.getElementById('demo-pay-success').onclick = function() {
        document.body.removeChild(backdrop);
        window.dispatchEvent(new CustomEvent(callbackName, {
          detail: {
            outcome: 'success',
            razorpay_payment_id: 'pay_test_' + Date.now(),
            razorpay_order_id: options.order_id || ('order_test_' + Date.now()),
            razorpay_signature: 'sig_test_mock_' + Date.now()
          }
        }));
      };

      document.getElementById('demo-pay-cancel').onclick = function() {
        document.body.removeChild(backdrop);
        window.dispatchEvent(new CustomEvent(callbackName, {
          detail: { outcome: 'cancelled' }
        }));
      };
    }

    window.addEventListener('OPEN_RAZORPAY_CHECKOUT', function(e) {
      var detail = e.detail || {};
      var options = JSON.parse(detail.options || '{}');
      var callbackName = detail.callbackName;

      options.handler = function(response) {
        window.dispatchEvent(new CustomEvent(callbackName, {
          detail: {
            outcome: 'success',
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_order_id: response.razorpay_order_id,
            razorpay_signature: response.razorpay_signature
          }
        }));
      };
      options.modal = {
        ondismiss: function() {
          window.dispatchEvent(new CustomEvent(callbackName, {
            detail: { outcome: 'cancelled' }
          }));
        }
      };

      if (options.key === 'rzp_test_demo' || (options.key && options.key.includes('demo')) || !window.Razorpay) {
        showDemoPaymentModal(options, callbackName);
        return;
      }

      try {
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function(response) {
          window.dispatchEvent(new CustomEvent(callbackName, {
            detail: { outcome: 'failed' }
          }));
        });
        rzp.open();
      } catch(err) {
        console.error('Razorpay Web JS Error:', err);
        showDemoPaymentModal(options, callbackName);
      }
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
